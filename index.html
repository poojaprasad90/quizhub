<title>JPA & JSF Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered study column; a setup panel, then one question at a time, then a results report. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --sunken: #f5f7fa;
  --ink: #172033;
  --muted: #5b6577;
  --line: #d9dfe8;
  --accent: #2f5bea;
  --accent-ink: #ffffff;
  --accent-soft: #e4eafd;
  --good: #1d7f53;
  --good-soft: #e2f3ea;
  --bad: #b93c28;
  --bad-soft: #fbe7e3;
  --code-bg: #eef1f6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --surface: #161d28; --sunken: #121822; --ink: #e6eaf2; --muted: #98a2b4;
    --line: #283142; --accent: #7d9bff; --accent-ink: #0e131b; --accent-soft: #1d2747;
    --good: #4cc38a; --good-soft: #13291f; --bad: #f07d68; --bad-soft: #321a16; --code-bg: #1f2735;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #161d28; --sunken: #121822; --ink: #e6eaf2; --muted: #98a2b4;
  --line: #283142; --accent: #7d9bff; --accent-ink: #0e131b; --accent-soft: #1d2747;
  --good: #4cc38a; --good-soft: #13291f; --bad: #f07d68; --bad-soft: #321a16; --code-bg: #1f2735;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.55;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  display: flex; flex-direction: column; gap: 22px;
}
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
}
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 42px);
  line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance;
}
h1 .at { color: var(--accent); }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px; display: flex; flex-direction: column; gap: 18px;
}
.label {
  font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
}
.field { display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 14px; cursor: pointer; border-radius: 999px;
  border: 1px solid var(--line); background: var(--sunken); color: var(--ink);
  padding: 7px 13px; display: inline-flex; gap: 8px; align-items: center;
}
.chip .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.deck { display: flex; flex-direction: column; gap: 8px; }
.deck + .deck { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.deckhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.deckname { font-weight: 600; font-size: 15px; }
.deckname .n { font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip[aria-pressed="true"] .n { color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; align-self: flex-start; }
.seg button {
  font: inherit; font-size: 14px; padding: 8px 16px; border: 0; background: var(--sunken); color: var(--ink); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 11px 20px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkish { font: inherit; font-size: 14px; background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 4px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); }
.hint kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--sunken); }

/* question view */
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta strong { color: var(--ink); font-weight: 600; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.tag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.qtext { font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 3.6vw, 24px); line-height: 1.3; margin: 0; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.opt {
  width: 100%; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start;
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunken);
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .key {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.opt .txt { min-width: 0; padding-top: 3px; overflow-wrap: anywhere; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .key { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.dim { opacity: .55; }
code {
  font-family: var(--font-mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
}
.feedback { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); background: var(--sunken); }
.feedback .verdict { font-weight: 600; }
.feedback.ok .verdict { color: var(--good); }
.feedback.no .verdict { color: var(--bad); }
.feedback p { margin: 0; }
.feedback .src { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* results */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(48px, 12vw, 72px); line-height: 1; font-variant-numeric: tabular-nums; }
.score .pct { font-family: var(--font-mono); font-size: 18px; color: var(--muted); }
.topics { display: flex; flex-direction: column; gap: 12px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 140px 48px; gap: 12px; align-items: center; font-size: 14px; }
.trow .num { font-family: var(--font-mono); font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.trow .bar span.low { background: var(--bad); }
.trow .bar span.mid { background: var(--accent); }
.trow .bar span.high { background: var(--good); }
@media (max-width: 480px) { .trow { grid-template-columns: minmax(0, 1fr) 70px 44px; } }
.missed { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
.missed li { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.missed .mq { font-weight: 600; }
.missed .ans { font-size: 14px; }
.missed .ans.you { color: var(--bad); }
.missed .ans.right { color: var(--good); }
.missed .why { font-size: 14px; color: var(--muted); margin: 0; }
h2.sec { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; }
.perfect { color: var(--good); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">CST8218 · Persistence with JPA · JavaServer Faces</span>
    <h1>JPA &amp; JSF <span class="at">Quiz</span></h1>
    <p class="lede">Multiple-choice practice built from two lecture decks: persistence with JPA (beans, entity mapping, persistence units, Lab 2) and JavaServer Faces (Facelets, EL, scopes, the request lifecycle, conversion and validation).</p>
  </header>
  <main id="app"></main>
</div>

<script>
const DECKS = { jpa: "Persistence with JPA", jsf: "JavaServer Faces" };
const TOPICS = {
  arch:   "Architecture & layers",
  beans:  "Beans & injection",
  jpa:    "JPA, ORM & JDBC",
  entity: "Entity mapping",
  pu:     "Persistence units & JTA",
  lab:    "DataSource & Lab 2",
  rest:   "REST recap & two paths",
  face:   "Facelets & templates",
  el:     "Named beans, scopes & EL",
  life:   "Lifecycle & navigation",
  conv:   "Conversion & validation"
};
const TOPIC_DECK = { arch:"jpa", beans:"jpa", jpa:"jpa", entity:"jpa", pu:"jpa", lab:"jpa", rest:"jsf", face:"jsf", el:"jsf", life:"jsf", conv:"jsf" };

const JPA_BANK = [
  // Architecture & layers (slides 2-4)
  {t:"arch", s:2, q:"What kind of architecture does the AddressBook application use?",
   o:["Single-tier desktop architecture","2-tier client/server architecture","3-tier architecture","Peer-to-peer architecture"], a:2,
   e:"The AddressBook is a 3-tiered application: presentation (browser, JSF pages, controller), business (facade and entity) and data (database)."},
  {t:"arch", s:3, q:"Which parts form the server side of the presentation layer?",
   o:["The browser and the HTML it displays","The named bean `ContactController` and the JSF `*.xhtml` pages","`ContactFacade` and the `Contact` entity","The database and its connection pool"], a:1,
   e:"The named bean and the JSF web pages run in GlassFish and make up the server side of the presentation layer. The browser is the client side."},
  {t:"arch", s:3, q:"What is the client side of the presentation layer?",
   o:["GlassFish","The JSF pages","The browser","The EntityManager"], a:2,
   e:"The user interacts with HTML pages in the browser window, which is the client side of the presentation layer."},
  {t:"arch", s:3, q:"Named beans that back a set of JSF pages are commonly given which name?",
   o:["Facade","Entity","Controller","Resource"], a:2,
   e:"Named beans are often used as backing beans for JSF pages, and they are typically named Controller, as in `ContactController`."},
  {t:"arch", s:4, q:"In the AddressBook application, what role does `ContactFacade` play?",
   o:["It renders the JSF pages","It acts as the data access object for Contact data","It defines the CONTACT table columns","It stores the user's HTTP session"], a:1,
   e:"`ContactFacade` is the data access object for Contact data. It gives the rest of the application one place to request database operations."},
  {t:"arch", s:4, q:"How does JPA relate a `Contact` object to the database?",
   o:["Each Contact object maps to one column","Each Contact object maps to one row in the CONTACT table","Each Contact object maps to a whole database","Each Contact object maps to one SQL query"], a:1,
   e:"Each `Contact` object represents one contact, and JPA maps it to one row in the CONTACT table."},

  // Beans & injection (slides 5-14)
  {t:"beans", s:5, q:"Which pair of rules describes the JavaBean conventions?",
   o:["Public attributes and no methods","Private attributes with public getter and setter methods","Static attributes with private constructors","Final attributes with protected getters only"], a:1,
   e:"A JavaBean keeps all attributes private and gives each one public getter and setter methods that follow standard naming patterns."},
  {t:"beans", s:5, q:"What is an attribute together with its getter and setter called?",
   o:["A field","A property","A dependency","A column"], a:1,
   e:"In JavaBean terms, an attribute plus its getter and setter methods is a property."},
  {t:"beans", s:6, q:"Which definition best fits an Enterprise Bean?",
   o:["A JSF page that displays business data","A server-managed component that performs business tasks","A database table with business rules","A browser plug-in for Jakarta EE"], a:1,
   e:"An Enterprise Bean is a server-managed component that performs business tasks. GlassFish creates and manages session bean objects."},
  {t:"beans", s:6, q:"Which session bean keeps state for one client across multiple calls?",
   o:["`@Stateless`","`@Stateful`","`@Singleton`","`@Named`"], a:1,
   e:"`@Stateful` beans keep state for one client across calls. `@Stateless` beans keep no client state, and `@Singleton` has one shared instance."},
  {t:"beans", s:6, q:"What is true of a `@Singleton` session bean?",
   o:["Each client gets its own instance","It has one shared instance for the whole application","It is destroyed after every method call","It can only be used from JSF pages"], a:1,
   e:"A singleton has one instance for the whole application, so any state it holds is shared by all clients."},
  {t:"beans", s:7, q:"What is a facade?",
   o:["A class that gives other classes an easy way to use a group of related operations","A configuration file for the persistence unit","A JSF tag library","A database view"], a:0,
   e:"A facade provides a simple entry point to a group of related operations. `ContactFacade` groups the persistence operations for Contact objects."},
  {t:"beans", s:7, q:"Which of these is NOT one of the `ContactFacade` operations listed in the slides?",
   o:["create","find","edit","render"], a:3,
   e:"`ContactFacade` provides create, find, edit and remove. Rendering pages is JSF's job."},
  {t:"beans", s:8, q:"What is a dependency?",
   o:["A Maven plug-in that compiles the project","An object that another object needs in order to do its work","A foreign key between two tables","A JSF validation rule"], a:1,
   e:"`ContactController` needs `ContactFacade` to work, so `ContactFacade` is a dependency of `ContactController`."},
  {t:"beans", s:9, q:"In `@EJB private ContactFacade ejbFacade;`, what is `ejbFacade`?",
   o:["The type of dependency required","The name of the field that will hold the injected reference","The JNDI name of the bean","The persistence unit name"], a:1,
   e:"`ContactFacade` is the required type. `ejbFacade` is just the field name that receives the reference."},
  {t:"beans", s:9, q:"How does the `ejbFacade` field get its value?",
   o:["`ContactController` calls `new ContactFacade()` in its constructor","An assignment statement in `persistence.xml`","GlassFish assigns the reference at runtime","The browser sends it with each request"], a:2,
   e:"There is no `new` and no assignment in the source code. GlassFish injects the reference at runtime."},
  {t:"beans", s:10, q:"How do `@Stateless` and `@EJB` divide the work?",
   o:["`@Stateless` identifies the managed Enterprise Bean; `@EJB` identifies where a reference to it is needed","`@Stateless` injects the bean; `@EJB` defines it","Both mark the class as a JPA entity","`@Stateless` sets the session scope; `@EJB` sets the URL path"], a:0,
   e:"`@Stateless` on `ContactFacade` tells GlassFish to manage it. `@EJB` on a field in `ContactController` asks GlassFish to supply it."},
  {t:"beans", s:11, q:"What does dependency injection mean?",
   o:["The application creates every object it needs with `new`","The container supplies an object reference that another object needs","The database injects rows into Java objects","The compiler inlines one class into another"], a:1,
   e:"With dependency injection, the container (GlassFish) supplies the reference, and the class simply uses it."},
  {t:"beans", s:12, q:"What happens if `ContactController` uses `new ContactFacade()` instead of injection?",
   o:["GlassFish still manages it as an Enterprise Bean","It becomes an ordinary Java object without the container services of `@Stateless`","The application refuses to compile","It becomes a singleton automatically"], a:1,
   e:"An object created with `new` is not managed by GlassFish, so it gets no lifecycle or transaction management."},
  {t:"beans", s:13, q:"What does CDI stand for?",
   o:["Container Deployment Interface","Contexts and Dependency Injection","Common Data Integration","Component Definition Index"], a:1,
   e:"CDI is Contexts and Dependency Injection, a service provided by Jakarta EE servers such as GlassFish."},
  {t:"beans", s:13, q:"Which annotation marks a field where CDI should supply an object reference?",
   o:["`@Inject`","`@Entity`","`@Column`","`@Transient`"], a:0,
   e:"`@Inject` tells CDI where an object reference is needed. CDI finds a compatible managed object and assigns it at runtime."},
  {t:"beans", s:14, q:"Which statement correctly compares `@EJB` and `@Inject`?",
   o:["Both can only inject JPA entities","`@EJB` must inject an Enterprise Bean; `@Inject` can inject any CDI-managed object, including an Enterprise Bean","`@Inject` only works with `@Stateful` beans","`@EJB` is for JSF pages; `@Inject` is for REST resources"], a:1,
   e:"Every object injected by `@EJB` must be an Enterprise Bean. An object injected by `@Inject` does not have to be one."},
  {t:"beans", s:14, q:"What normally happens if GlassFish cannot find a matching Enterprise Bean for an `@EJB` field?",
   o:["The field is silently set to a new empty object","Injection fails and the application normally cannot be deployed","GlassFish creates a database table instead","The field falls back to `@Inject`"], a:1,
   e:"A missing match causes injection to fail, and the application normally cannot be deployed."},

  // JPA, ORM & JDBC (slides 15-18)
  {t:"jpa", s:15, q:"What does JPA stand for in Jakarta EE?",
   o:["Java Page Architecture","Jakarta Persistence API","Jakarta Protocol Adapter","Java Pooling API"], a:1,
   e:"JPA is the Jakarta Persistence API, the standard API for storing and retrieving Java object data in a relational database."},
  {t:"jpa", s:15, q:"Which JPA provider does GlassFish use?",
   o:["Hibernate","EclipseLink","MyBatis","Apache Derby"], a:1,
   e:"A JPA provider is the software that implements JPA. GlassFish uses EclipseLink."},
  {t:"jpa", s:16, q:"Under ORM, what does a Java field such as `firstName` map to?",
   o:["A table","A row","A column","A database"], a:2,
   e:"ORM maps classes to tables, objects to rows, and fields to columns. `firstName` maps to the FIRSTNAME column."},
  {t:"jpa", s:17, q:"Which statement about JDBC is true?",
   o:["JDBC is a database engine that stores data","JDBC is a standard Java API for sending SQL to relational databases and receiving results","JDBC is a JSF component library","JDBC replaces JPA in Jakarta EE"], a:1,
   e:"JDBC is an API. It is not a database engine and does not store data itself."},
  {t:"jpa", s:17, q:"What does a JDBC driver do?",
   o:["Generates entity classes from tables","Connects Java code to a particular database system","Renders query results as HTML","Manages HTTP sessions"], a:1,
   e:"A JDBC driver is the piece that lets Java code talk to a specific database, such as MariaDB."},
  {t:"jpa", s:17, q:"When programmers use JDBC directly, which task do they NOT have to do themselves?",
   o:["Write the SQL","Read the returned column values","Copy values into Java objects","Store the table rows on disk"], a:3,
   e:"With raw JDBC you write and execute SQL and copy results into objects. Storing rows on disk is the database's job."},
  {t:"jpa", s:18, q:"How are JPA and JDBC related?",
   o:["JPA replaces JDBC entirely","JPA uses JDBC behind the scenes","JDBC uses JPA behind the scenes","They cannot be used in the same application"], a:1,
   e:"JPA does not replace JDBC. EclipseLink uses JDBC to communicate with the database."},
  {t:"jpa", s:18, q:"In the JPA stack, which component generates the SQL?",
   o:["The application code","The JPA provider (EclipseLink)","The browser","The JSF page"], a:1,
   e:"Application code works with entity objects. EclipseLink maps the data, generates SQL, and converts results back into objects."},

  // Entity mapping (slides 20-23)
  {t:"entity", s:20, q:"What does `@Entity` tell JPA?",
   o:["To expose the class as a REST resource","To treat the class as an entity whose objects can be stored in the database","To make the class session-scoped","To skip the class during deployment"], a:1,
   e:"`@Entity` marks a class such as `Contact` as an entity. JPA then maps its fields to columns."},
  {t:"entity", s:20, q:"Which package should entity annotations be imported from?",
   o:["`jakarta.ejb.*`","`jakarta.persistence.*`","`jakarta.faces.*`","`java.sql.*`"], a:1,
   e:"Use imports from `jakarta.persistence.*`, for example `jakarta.persistence.Entity`."},
  {t:"entity", s:21, q:"By default, how does JPA map a persistent field?",
   o:["To a column with the same name","To a separate table","It does not map fields without `@Column`","To a randomly named column"], a:0,
   e:"Each persistent field maps to a column with the same name by default. `@Column` is optional and only needed to customize the mapping."},
  {t:"entity", s:21, q:"When should you use `@Column(name = \"FIRSTNAME\", length = 50)`?",
   o:["On every field, because it is required","When the column mapping needs to be customized","Only on the primary key","Only on fields that should not be stored"], a:1,
   e:"`@Column` is optional. Add it when JPA needs more information, such as a column name or length."},
  {t:"entity", s:21, q:"What does `@Transient` on a field do?",
   o:["Makes it the primary key","Tells JPA not to store the field in the database","Encrypts the field","Makes the field read-only in JSF"], a:1,
   e:"A `@Transient` field such as `displayName` exists in the object but is not persisted."},
  {t:"entity", s:22, q:"What does `@Id` mark?",
   o:["The JNDI name","The field that is the entity's primary key","The persistence unit","The connection pool"], a:1,
   e:"Every entity needs a field that uniquely identifies each object. In `Contact`, `@Id` marks the `id` field."},
  {t:"entity", s:22, q:"What does `@GeneratedValue(strategy = GenerationType.AUTO)` do?",
   o:["Asks the user to enter a unique ID","Tells JPA to generate the ID and lets the provider choose how","Copies the ID from the browser session","Generates a new table for each object"], a:1,
   e:"`@GeneratedValue` makes JPA generate IDs automatically. AUTO lets the JPA provider pick the generation method."},
  {t:"entity", s:23, q:"Which Lab 2 change is correct for the `id` field?",
   o:["Delete the `id` field from `Contact.java`","Comment out the `id` input lines in the pages","Delete the `id` input lines from `Create.xhtml` and `Edit.xhtml` but keep `id` in `Contact.java`","Make the `id` input required on every page"], a:2,
   e:"JPA generates the ID, so the user should not enter it. Delete (not comment out) those page lines, but keep the primary key in the entity."},

  // Persistence units & JTA (slides 24-28)
  {t:"pu", s:24, q:"What is a persistence unit?",
   o:["A single row in a table","A named set of configuration used by JPA","A type of session bean","A JSF page template"], a:1,
   e:"A persistence unit tells JPA which entity classes belong to the app, which database connection to use, and which provider and settings apply."},
  {t:"pu", s:24, q:"Where is a persistence unit configured, and what is it named in the AddressBook?",
   o:["`web.xml`, named `ContactPU`","`persistence.xml`, named `address-bookPU`","`glassfish-resources.xml`, named `mysql_test_pool`","`pom.xml`, named `AddressBook`"], a:1,
   e:"The AddressBook persistence unit is `address-bookPU`, defined in `persistence.xml`."},
  {t:"pu", s:24, q:"Which summary matches the slides?",
   o:["The entity class describes what to store; the persistence unit tells JPA where and how to store it","The persistence unit describes what to store; the entity says where","Both describe only the user interface","The entity class chooses the database server"], a:0,
   e:"The entity defines the data. The persistence unit supplies the data source, provider and settings."},
  {t:"pu", s:25, q:"In `persistence.xml`, what does `<jta-data-source>` identify?",
   o:["The entity classes","The database connection the persistence unit uses","The transaction timeout","The JSF view to render"], a:1,
   e:"`<jta-data-source>` names the DataSource (for example `java:app/AnotherDB`). The `<class>` element lists entity classes."},
  {t:"pu", s:25, q:"What does the `<class>` element inside a persistence unit identify?",
   o:["An entity class that belongs to the persistence unit","The JDBC driver class","The controller class","The CSS class for the pages"], a:0,
   e:"`<class>addressbook.Contact</class>` adds the `Contact` entity to the unit."},
  {t:"pu", s:26, q:"In `@PersistenceContext(unitName = \"address-bookPU\")`, what does `unitName` do?",
   o:["Names the database table","Identifies which persistence unit the EntityManager should use","Sets the JNDI name of the controller","Names the connection pool"], a:1,
   e:"`unitName` must match the name in `persistence.xml`, so the injected EntityManager uses that unit's configuration."},
  {t:"pu", s:26, q:"How does `ContactFacade` get its EntityManager?",
   o:["It calls `new EntityManager()`","GlassFish supplies it through `@PersistenceContext`","The controller passes it in each call","It reads it from the browser cookie"], a:1,
   e:"`@PersistenceContext` asks GlassFish to supply a managed EntityManager. The code never creates one with `new`."},
  {t:"pu", s:27, q:"In the persistence diagram, what does the DataSource provide?",
   o:["Entity class definitions","Connections to the database","JSF navigation rules","Bean scopes"], a:1,
   e:"The persistence unit points to the DataSource, and the DataSource provides the connections to the database."},
  {t:"pu", s:28, q:"What is a transaction?",
   o:["A single SQL SELECT","One or more database changes treated as one unit of work","A JSF postback","A REST request header"], a:1,
   e:"If the work succeeds the transaction is committed. If it fails, it can be rolled back and the changes are cancelled."},
  {t:"pu", s:28, q:"What does JTA stand for, and who coordinates it here?",
   o:["Java Table Access, coordinated by MariaDB","Jakarta Transactions, coordinated by GlassFish","JSON Transfer API, coordinated by the browser","Jakarta Tag Attributes, coordinated by JSF"], a:1,
   e:"JTA is Jakarta Transactions. GlassFish provides the JTA service and manages the transaction around `ContactFacade` operations."},
  {t:"pu", s:28, q:"In the reference AddressBook, does `ContactFacade` call `begin()` and `commit()` itself?",
   o:["Yes, in every method","Only in `create()`","No, GlassFish manages the transaction","Only when using Derby"], a:2,
   e:"With `transaction-type=\"JTA\"`, GlassFish manages the transaction, so the facade normally does not call `begin()` or `commit()`."},

  // DataSource & Lab 2 (slides 29-36)
  {t:"lab", s:29, q:"Which databases do Lab 1 and Lab 2 use?",
   o:["Lab 1: MariaDB; Lab 2: Derby","Lab 1: Apache Derby; Lab 2: MariaDB","Both use MariaDB","Lab 1: PostgreSQL; Lab 2: MariaDB"], a:1,
   e:"Lab 1 stores AddressBook data in Apache Derby. Lab 2 moves it to MariaDB."},
  {t:"lab", s:29, q:"When moving from Derby to MariaDB, what changes?",
   o:["The way the application works with entity objects","The database connection","The JSF component library","The entity annotations"], a:1,
   e:"The application still uses JPA and entity objects. Only the database connection changes."},
  {t:"lab", s:30, q:"What port does MariaDB normally use?",
   o:["1527","3306","5432","8080"], a:1,
   e:"MariaDB normally listens on port 3306. (1527 is Derby's port, and 8080 is GlassFish's HTTP port.)"},
  {t:"lab", s:30, q:"Which JDBC driver class does Lab 2 use to talk to MariaDB?",

   e:"The slides list `com.mysql.cj.jdbc.Driver` as the JDBC driver class."},
  {t:"lab", s:30, q:"Why does Lab 2 add `&useSSL=false` to the JDBC URL?",
   o:["SSL is never needed for databases","SSL certificates are not configured in this local lab exercise","It makes queries run faster in production","It disables transactions"], a:1,
   e:"SSL is disabled only because certificates are not set up for the local lab. Production connections should normally use SSL."},
  {t:"lab", s:31, q:"What does JNDI stand for?",
   o:["Java Naming and Directory Interface","Jakarta Network Data Integration","Java Native Database Interface","JSON Naming and Data Index"], a:0,
   e:"JNDI is the Java Naming and Directory Interface. GlassFish registers the DataSource under a JNDI name."},
  {t:"lab", s:31, q:"What is a connection pool?",
   o:["A set of entity classes","A collection of reusable connections to the database","A list of JSF pages","A backup copy of the database"], a:1,
   e:"A connection pool holds reusable database connections. The DataSource is connected to the pool."},
  {t:"lab", s:31, q:"In the slides, how do `java:app/AnotherDB` and `mysql_test_pool` differ?",
   o:["They are two names for the same thing","`java:app/AnotherDB` is the JNDI name; `mysql_test_pool` is the connection-pool name","`java:app/AnotherDB` is the database; `mysql_test_pool` is the table","Both are persistence unit names"], a:1,
   e:"The application finds the DataSource by its JNDI name. The DataSource sits on top of the connection pool, which has its own name."},
  {t:"lab", s:31, q:"How does the application find the DataSource?",
   o:["By its JNDI name","By the table name","By the entity class name","By the browser URL"], a:0,
   e:"GlassFish registers the DataSource under a JNDI name, and the application looks it up by that name."},
  {t:"lab", s:32, q:"In NetBeans' Create Data Source dialog, what does the selected database connection already contain?",
   o:["The JSF pages","The host, port, database name, username and JDBC settings","The entity classes","The transaction type"], a:1,
   e:"You enter a JNDI name and pick an existing MariaDB connection, which already holds the details needed to reach the database."},
  {t:"lab", s:33, q:"How do Lab 2 Part 1 and Part 2 differ?",
   o:["Part 1 creates the table from the entity class; Part 2 creates the entity class from the table","Part 1 creates the entity from the table; Part 2 creates the table from the entity","Both parts create tables by hand","Part 2 uses Derby instead of MariaDB"], a:0,
   e:"Part 1 lets JPA create CONTACT from `Contact.java`. Part 2 generates `Contact.java` from the existing CONTACT table."},
  {t:"lab", s:34, q:"Which table creation strategy should you select for Lab 2 Part 2?",
   o:["Create","Drop and Create","None","Update"], a:2,
   e:"The CONTACT table already exists, so None makes JPA use it without creating or replacing it."},
  {t:"lab", s:34, q:"Why should you avoid Drop and Create in Lab 2?",
   o:["It is not supported by MariaDB","It may delete and recreate the existing table","It disables the connection pool","It removes the `@Id` annotation"], a:1,
   e:"Drop and Create can wipe out the existing CONTACT table and its data."},
  {t:"lab", s:35, q:"What does `glassfish-resources.xml` do?",
   o:["Lists the JSF pages","Tells GlassFish how the DataSource connects to the database","Defines the entity's columns","Configures Maven build phases"], a:1,
   e:"NetBeans generates it when you create the DataSource. It holds the GlassFish configuration for the DataSource and its connection pool."},
  {t:"lab", s:35, q:"Which DataSource class name should you verify in `glassfish-resources.xml`?",
   o:["`com.mysql.cj.jdbc.MysqlDataSource`","`com.mysql.cj.jdbc.Driver`","`org.apache.derby.jdbc.ClientDataSource`","`jakarta.sql.DataSource`"], a:0,
   e:"The generated DataSource class should be `com.mysql.cj.jdbc.MysqlDataSource`. `com.mysql.cj.jdbc.Driver` is the JDBC driver class, a different setting."},
  {t:"lab", s:35, q:"Which file tells JPA which DataSource to use?",
   o:["`persistence.xml`","`glassfish-resources.xml`","`Create.xhtml`","`ContactController.java`"], a:0,
   e:"`persistence.xml` points JPA at the DataSource. `glassfish-resources.xml` tells GlassFish how that DataSource connects."},
  {t:"lab", s:36, q:"Which statement matches the Lab 1 vs Lab 2 comparison?",
   o:["In Lab 1 the Java class defines the table; in Lab 2 the table defines the Java class","In both labs the table defines the Java class","In Lab 1 NetBeans reads the table; in Lab 2 JPA reads the annotations","Neither lab uses an entity class"], a:0,
   e:"Lab 1 starts with the annotated entity and JPA creates the table. Lab 2 starts with the MariaDB table and NetBeans generates the entity."}

const JSF_BANK = [
  // REST recap & two paths (slides 2-4)

   e:"Clients exchange XML or JSON with the API and never depend on how the server stores the data."},
  {t:"rest", s:4, q:"What do `ContactFacade` and `ContactFacadeREST` have in common?",
   o:["Both are JSF backing beans","Both extend `AbstractFacade<Contact>` and inherit its basic CRUD operations","Both are session-scoped CDI beans","Both render HTML"], a:1,

  {t:"rest", s:4, q:"Which sequence is the JSF page path to the data?",

   e:"The Facelet is the page we write. JSF processes it on GlassFish, and the browser receives HTML."},

  {t:"face", s:7, q:"Which statement correctly compares a Facelet with plain HTML?",

  // Named beans, scopes & EL (slides 10-13)

  {t:"conv", s:24, q:"How do Bean Validation annotations differ from JSF component validation?",
   o:["Bean Validation places rules on the model; JSF validators place rules on one page component","Bean Validation is written in the Facelet; JSF validation is written in Java","They are the same thing","JSF validation applies to every page using the model"], a:0,
   e:"Annotations such as `@Past` on the property apply wherever the model is used. `required` or `<f:validateLongRange>` apply only to that input."},
  {t:"conv", s:24, q:"Which of these is a Bean Validation annotation rather than JSF component validation?",
   o:["`required=\"true\"`","`<f:validateLongRange>`","`@Past`","`requiredMessage`"], a:2,
   e:"`@Min`, `@Max`, `@Past` and `@Pattern` go on model properties. `required` and `<f:validateLongRange>` go in the Facelet."},
  {t:"conv", s:24, q:"An age input has `<f:validateLongRange minimum=\"18\" maximum=\"100\" />`. The user enters `15`. What happens?",
   o:["Conversion fails","Validation fails and the page is redisplayed with a message","15 is saved","JSF rounds it to 18"], a:1,
   e:"15 converts to a number but falls outside the allowed range, so validation fails."},

   o:["Conversion fails because of the minus sign","\"-20\" converts to Integer, `@Min(0)` validation fails, and the model is not updated","The value is saved and corrected later","`@Max` fails"], a:1,
   e:"\"X position cannot be negative.\" is shown, the model isn't updated, and the action isn't invoked."},
  {t:"conv", s:25, q:"In the Bouncer entity, which constant limits `x` through `@Max`?",
   o:["`FRAME_HEIGHT`","`MAX_SPEED`","`FRAME_WIDTH`","`MIN_X`"], a:2,
   e:"`x` uses `FRAME_WIDTH`. `y` uses `FRAME_HEIGHT`, and `ySpeed` uses `MAX_SPEED`."},
  {t:"conv", s:26, q:"After the user clicks Save on `Create.xhtml` and the input is valid, what finally stores the Contact?",
   o:["The Facelet writes it directly","`create()` runs and `ContactFacade` persists `selected` to the database","`prepareCreate()` saves it","The browser sends it to the REST API"], a:1,
   e:"One click travels through the JSF lifecycle and the backing bean, and `ContactFacade` persists the Contact as a database row."}

const BANK = [
  ...JPA_BANK.map(q => ({ ...q, d: "jpa" })),
  ...JSF_BANK.map(q => ({ ...q, d: "jsf" }))
];

const app = document.getElementById("app");
const LETTERS = "ABCDE";
const setup = { topics: new Set(Object.keys(TOPICS)), count: 20, shuffle: true };
let run = null;

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmt(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pool() { return BANK.filter(q => setup.topics.has(q.t)); }
function plannedCount() { const n = pool().length; return setup.count === 0 ? n : Math.min(setup.count, n); }

function makeRun(questions) {
  const items = questions.map(src => {
    const order = shuffled(src.o.map((_, i) => i));
    return { src, order, answer: order.indexOf(src.a), picked: null };
  });
  run = { items, i: 0, score: 0 };
  renderQuestion();
}

function startFromSetup() {
  let qs = pool();
  if (setup.shuffle) qs = shuffled(qs);
  else qs = qs.slice().sort((a, b) => (a.d === b.d ? 0 : a.d === "jpa" ? -1 : 1) || a.s - b.s);
  const n = plannedCount();
  makeRun(qs.slice(0, n));
}

function renderSetup() {
  run = null;
  const counts = {}, deckCounts = {};
  BANK.forEach(q => { counts[q.t] = (counts[q.t] || 0) + 1; deckCounts[q.d] = (deckCounts[q.d] || 0) + 1; });
  const n = plannedCount();
  const deckGroup = d => {
    const keys = Object.keys(TOPICS).filter(k => TOPIC_DECK[k] === d);
    const allOn = keys.every(k => setup.topics.has(k));
    return `
      <div class="deck">
        <div class="deckhead">
          <span class="deckname">${esc(DECKS[d])} <span class="n">${deckCounts[d]} questions</span></span>
          <button type="button" class="linkish" id="deck-${d}" data-deck="${d}">${allOn ? "Clear" : "Select all"}</button>
        </div>
        <div class="chips">
          ${keys.map(k => `
            <button type="button" class="chip" id="topic-${k}" data-topic="${k}" aria-pressed="${setup.topics.has(k)}">${esc(TOPICS[k])} <span class="n">${counts[k]}</span></button>`).join("")}
        </div>
      </div>`;
  };
  app.innerHTML = `
    <section class="panel" aria-labelledby="setupTitle">
      <div class="meta"><span id="setupTitle"><strong>${BANK.length} questions</strong> from ${Object.keys(DECKS).length} slide decks</span><span>${pool().length} selected</span></div>
      <div class="field">
        <span class="label">Topics</span>
        ${Object.keys(DECKS).map(deckGroup).join("")}
      </div>
      <div class="field">
        <span class="label">Length</span>
        <div class="seg" role="group" aria-label="Number of questions">
          ${[[10,"10"],[20,"20"],[40,"40"],[0,"All"]].map(([v, l]) => `<button type="button" id="count-${l}" data-count="${v}" aria-pressed="${setup.count === v}">${l}</button>`).join("")}
        </div>
      </div>
      <label class="check"><input type="checkbox" id="shuffle" ${setup.shuffle ? "checked" : ""}> Shuffle questions (off follows slide order)</label>
      <div class="row">
        <button type="button" class="btn" id="start" ${n === 0 ? "disabled" : ""}>Start ${n} question${n === 1 ? "" : "s"}</button>
        <span class="hint">${n === 0 ? "Pick at least one topic." : "Answer with <kbd>1</kbd>–<kbd>5</kbd>, continue with <kbd>Enter</kbd>."}</span>
      </div>
    </section>`;
  app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => {
    const k = b.dataset.topic;
    setup.topics.has(k) ? setup.topics.delete(k) : setup.topics.add(k);
    renderSetup();
    document.getElementById("topic-" + k).focus();
  });
  app.querySelectorAll("[data-deck]").forEach(b => b.onclick = () => {
    const d = b.dataset.deck;
    const keys = Object.keys(TOPICS).filter(k => TOPIC_DECK[k] === d);
    const allOn = keys.every(k => setup.topics.has(k));
    keys.forEach(k => allOn ? setup.topics.delete(k) : setup.topics.add(k));
    renderSetup();
    document.getElementById("deck-" + d).focus();
  });
  app.querySelectorAll("[data-count]").forEach(b => b.onclick = () => {
    setup.count = Number(b.dataset.count); renderSetup(); document.getElementById(b.id).focus();
  });
  document.getElementById("shuffle").onchange = e => { setup.shuffle = e.target.checked; };
  document.getElementById("start").onclick = startFromSetup;
}

function renderQuestion() {
  const it = run.items[run.i];
  const total = run.items.length;
  const answered = it.picked !== null;
  const done = run.i + (answered ? 1 : 0);
  const optsHtml = it.order.map((orig, pos) => {
    let cls = "opt";
    if (answered) {
      if (pos === it.answer) cls += " correct";
      else if (pos === it.picked) cls += " wrong";
      else cls += " dim";
    }
    return `<li><button type="button" class="${cls}" id="opt-${pos}" data-pos="${pos}" ${answered ? "disabled" : ""}>
      <span class="key">${LETTERS[pos]}</span><span class="txt">${fmt(it.src.o[orig])}</span></button></li>`;
  }).join("");
  const ok = answered && it.picked === it.answer;
  const last = run.i === total - 1;
  app.innerHTML = `
    <section class="panel" aria-live="polite">
      <div class="meta">
        <span>Question <strong>${run.i + 1}</strong> of ${total}</span>
        <span><strong>${run.score}</strong> correct</span>
      </div>
      <div class="bar" aria-hidden="true"><span style="width:${(done / total) * 100}%"></span></div>
      <span class="tag">${esc(DECKS[it.src.d])} · Slide ${it.src.s} · ${esc(TOPICS[it.src.t])}</span>
      <h2 class="qtext">${fmt(it.src.q)}</h2>
      <ul class="opts">${optsHtml}</ul>
      ${answered ? `
        <div class="feedback ${ok ? "ok" : "no"}">
          <span class="verdict">${ok ? "Correct." : "Not quite. The answer is " + LETTERS[it.answer] + "."}</span>
          <p>${fmt(it.src.e)}</p>
          <span class="src">Source: ${esc(DECKS[it.src.d])}, slide ${it.src.s}</span>
        </div>
        <div class="row"><button type="button" class="btn" id="next">${last ? "See results" : "Next question"}</button></div>` : ""}
      <div class="row"><button type="button" class="linkish" id="quit">End quiz and see results</button></div>
    </section>`;
  app.querySelectorAll("[data-pos]").forEach(b => b.onclick = () => pick(Number(b.dataset.pos)));
  document.getElementById("quit").onclick = renderResults;
  if (answered) {
    const nx = document.getElementById("next");
    nx.onclick = next; nx.focus();
  }
}

function pick(pos) {
  const it = run.items[run.i];
  if (it.picked !== null) return;
  it.picked = pos;
  if (pos === it.answer) run.score++;
  renderQuestion();
}
function next() {
  if (run.i < run.items.length - 1) { run.i++; renderQuestion(); window.scrollTo({ top: 0 }); }
  else renderResults();
}

function renderResults() {
  const answered = run.items.filter(it => it.picked !== null);
  const missed = answered.filter(it => it.picked !== it.answer);
  const n = answered.length;
  const pct = n ? Math.round((run.score / n) * 100) : 0;
  const byTopic = {};
  answered.forEach(it => {
    const t = byTopic[it.src.t] || (byTopic[it.src.t] = { c: 0, n: 0 });
    t.n++; if (it.picked === it.answer) t.c++;
  });
  const msg = n === 0 ? "No questions answered yet."
    : pct >= 90 ? "Ready for the quiz."
    : pct >= 70 ? "Solid. Review the missed questions below."
    : "Worth another pass through the slides marked below.";
  app.innerHTML = `
    <section class="panel">
      <span class="label">Result</span>
      <div class="score"><span class="big">${run.score}/${n}</span><span class="pct">${pct}%</span></div>
      <p style="margin:0">${msg}${n < run.items.length ? ` You answered ${n} of ${run.items.length}.` : ""}</p>
      ${n ? `<div class="topics">
        ${Object.keys(TOPICS).filter(k => byTopic[k]).map(k => {
          const t = byTopic[k], p = t.c / t.n;
          const cls = p >= .85 ? "high" : p >= .6 ? "mid" : "low";
          return `<div class="trow"><span>${esc(TOPICS[k])}</span><div class="bar"><span class="${cls}" style="width:${p * 100}%"></span></div><span class="num">${t.c}/${t.n}</span></div>`;
        }).join("")}
      </div>` : ""}
      <div class="row">
        ${missed.length ? `<button type="button" class="btn" id="retry">Retry ${missed.length} missed</button>` : ""}
        <button type="button" class="btn ${missed.length ? "ghost" : ""}" id="again">New quiz</button>
      </div>
    </section>
    ${n ? `<section class="panel">
      <h2 class="sec">${missed.length ? "Missed questions" : "Review"}</h2>
      ${missed.length ? `<ul class="missed">
        ${missed.map(it => `<li>
          <span class="tag">${esc(DECKS[it.src.d])} · Slide ${it.src.s} · ${esc(TOPICS[it.src.t])}</span>
          <span class="mq">${fmt(it.src.q)}</span>
          <span class="ans you">Your answer: ${fmt(it.src.o[it.order[it.picked]])}</span>
          <span class="ans right">Correct: ${fmt(it.src.o[it.src.a])}</span>
          <p class="why">${fmt(it.src.e)}</p>
        </li>`).join("")}
      </ul>` : `<p class="perfect" style="margin:0">Every answered question was correct.</p>`}
    </section>` : ""}`;
  const r = document.getElementById("retry");
  if (r) r.onclick = () => makeRun(shuffled(missed.map(it => it.src)));
  document.getElementById("again").onclick = renderSetup;
  window.scrollTo({ top: 0 });
}

document.addEventListener("keydown", e => {
  if (!run || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!document.getElementById("next") && !document.querySelector("[data-pos]")) return;
  const it = run.items[run.i];
  if (!it) return;
  if (it.picked === null && /^[1-5]$/.test(e.key)) {
    const pos = Number(e.key) - 1;
    if (pos < it.order.length) { e.preventDefault(); pick(pos); }
  } else if (it.picked !== null && e.key === "Enter" && document.activeElement?.id !== "next") {
    e.preventDefault(); next();
  }
});

renderSetup();
</script>
